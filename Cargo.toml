[workspace]
members = [
  "broken-antler",
  "shared",
  "xtask",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
brunhilde = { path = "../brunhilde" }
chrono = { version = "0.4.42", features = [ "serde" ] }
#chrono = { git = "https://github.com/Zk2u/chrono", rev = "f7430fc", features = [ "serde", "rkyv-32", "rkyv-validation" ] }
geoutils = { git = "https://github.com/helixbass/geoutils", rev = "4dfde485", features = [ "rkyv", "serde" ] }
indexmap = "2.12.1"
itertools = "0.14.0"
rkyv = { version = "0.8.13", features = [ "smol_str-0_3", "uuid-1" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1.15.1"
smol_str = "0.3.4"
squalid = { git = "https://github.com/helixbass/squalid", rev = "646f6bf" }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
uuid = { version = "1.19.0", features = [ "v4", "serde" ] }
